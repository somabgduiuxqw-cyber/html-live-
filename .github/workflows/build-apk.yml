name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          # Detect active Java major version
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            JAVA_MAJOR=$(java -version 2>&1 | sed -nE 's/.*version "([0-9]+).*/\1/p' | head -n 1)
          fi

          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Failed to detect active Java major version."
            exit 1
          fi

          echo "Detected active Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version is lower than 17 (found: $JAVA_MAJOR)."
            exit 1
          fi

          echo "Java environment verified successfully."

      - name: Locate Gradle project root
        id: find_gradle
        run: |
          echo "=== Workspace Inspection ==="
          pwd
          ls -la

          # Determine where settings.gradle.kts or settings.gradle resides
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
            echo "Found Gradle build root in current directory: $PROJECT_DIR"
          else
            FOUND_SETTINGS=$(find . -maxdepth 4 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
              echo "Found Gradle build root in subfolder: $PROJECT_DIR"
            else
              echo "Warning: No settings.gradle found in workspace. Searching all files:"
              find . -maxdepth 3
              PROJECT_DIR="."
            fi
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          build-root-directory: ${{ steps.find_gradle.outputs.project_dir }}

      - name: Create temporary debug keystore
        run: |
          PROJECT_DIR="${{ steps.find_gradle.outputs.project_dir }}"
          echo "=== Setting up debug.keystore in root and $PROJECT_DIR ==="

          generate_keystore() {
            local target="$1"
            if [ ! -f "$target" ]; then
              echo "Generating temporary debug keystore at $target..."
              keytool -genkey -v \
                -keystore "$target" \
                -alias androiddebugkey \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000
            else
              echo "Keystore already exists at $target."
            fi
          }

          generate_keystore "./debug.keystore"
          if [ "$PROJECT_DIR" != "." ]; then
            generate_keystore "$PROJECT_DIR/debug.keystore"
          fi

          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          PROJECT_DIR="${{ steps.find_gradle.outputs.project_dir }}"
          echo "=== Building debug APK in project directory: $PROJECT_DIR ==="
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Locate and verify debug APK
        id: locate_apk
        run: |
          PROJECT_DIR="${{ steps.find_gradle.outputs.project_dir }}"
          echo "=== Locating Debug APK ==="

          # Primary expected location
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" -type f 2>/dev/null | head -n 1)

          # Fallback search anywhere in workspace
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*debug*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK not found in $PROJECT_DIR or workspace."
            find . -name "*.apk" || true
            exit 1
          fi

          APK_SIZE=$(wc -c < "$APK_PATH" | tr -d ' ')
          if [ "$APK_SIZE" -le 0 ]; then
            echo "Error: Debug APK file is empty ($APK_SIZE bytes)"
            exit 1
          fi

          echo "Found debug APK: $APK_PATH ($APK_SIZE bytes)"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish debug APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          TAG="v1.0.${{ github.run_number }}"
          APK_FILE="${{ steps.locate_apk.outputs.apk_path }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading APK asset..."
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            echo "Creating new release $TAG and publishing APK..."
            cat << 'EOF' > release_notes.md
          ## HTML Live - Debug Build

          Automated debug APK build from branch `${{ github.ref_name }}`.

          - **Run ID**: ${{ github.run_id }}
          - **Commit**: ${{ github.sha }}
          - **File**: ${{ steps.locate_apk.outputs.apk_filename }}

          Download the APK below directly onto your Android device to install and test.
          This release ensures the completed APK build result was not lost.
          EOF

            gh release create "$TAG" "$APK_FILE" \
              --title "HTML Live Debug Build $TAG" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA"
          fi
